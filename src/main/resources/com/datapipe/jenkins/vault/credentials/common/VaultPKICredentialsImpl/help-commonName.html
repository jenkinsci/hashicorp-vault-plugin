<div>
  <p>
    The Common Name (CN) for the issued certificate, e.g. <code>jenkins.example.com</code>.
  </p>
  <p>
    The value must be permitted by the PKI role's <code>allowed_domains</code> setting.
    When <code>allow_bare_domains</code> is enabled on the role, the bare domain may be used;
    when <code>allow_subdomains</code> is enabled, subdomains are allowed.
  </p>
</div>
