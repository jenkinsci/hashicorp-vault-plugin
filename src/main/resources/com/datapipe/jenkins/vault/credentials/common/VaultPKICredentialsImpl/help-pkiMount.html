<div>
  <p>
    The mount path of the Vault PKI secrets engine (default: <code>pki</code>).
  </p>
  <p>
    Use a custom value if you have multiple PKI engines mounted at different paths, e.g.
    <code>pki-intermediate</code> or <code>pki-root</code>.
  </p>
  <p>
    Vault policy example:
    <pre>path "&lt;mount&gt;/issue/&lt;role&gt;" {
  capabilities = ["create", "update"]
}</pre>
  </p>
</div>
